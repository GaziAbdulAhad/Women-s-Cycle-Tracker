<h1>কনটেন্ট ব্যবস্থাপনা</h1><div class="notice" role="note">এখানে লেখা প্রকাশ করলে সাইন-ইন করা ব্যবহারকারীরা “শেখার তথ্য” পেজে দেখবেন। চিকিৎসা-সংক্রান্ত লেখা প্রকাশের আগে চিকিৎসক দিয়ে যাচাই করুন।</div><form id="aform" class="card"><label for="atitle">শিরোনাম</label><input id="atitle" maxlength="120" required><label for="abody">লেখা</label><textarea id="abody" rows="8" maxlength="6000" required></textarea><label for="astatus">অবস্থা</label><select id="astatus"><option value="draft">খসড়া</option><option value="published">প্রকাশিত</option></select><p class="row"><button class="btn" type="submit">সেভ করুন</button><button class="btn alt" id="cancelBtn" type="button" hidden>বাতিল</button></p></form><div id="msg" role="status" aria-live="polite"></div><div class="card"><h2>সব লেখা</h2><div id="list"></div></div>
